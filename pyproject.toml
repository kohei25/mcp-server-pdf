[project]
name = "mcp-server-pdf"
version = "0.1.0"
description = "PDFやPDFのウェブリンクを扱うmcpサーバー"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.9.1",
    "loguru>=0.7.3",
    "aiofiles>=24.1.0",
    "httpx>=0.28.1",
    "pymupdf4llm>=0.0.24",
]

[project.scripts]
mcp-server-pdf = "mcp_server_pdf.__main__:main_sync"

[tool.pytest.ini_options]
testpaths = ["."]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=9.0.2",
]
